<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FinalA - Interactive Soup Cans</title>


  <script src="p5.min.js"></script>


  <script src="p5.sound.min.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
    }

    #sketch-holder {
      width: 100vw;
      height: 100vh;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

  <div id="sketch-holder"></div>

<!-- 
    Load the project scripts in this order because later files depend on
    functions and state variables created by earlier files.

    1. time-based-mechanic.js
       Handles time-based animation states, such as how the cans open,
       reset, or change over time.

    2. user-input-mechanic.js
       Handles mouse and keyboard interaction states, such as hover,
       clicking, and liquid-style visual responses.

    3. audio-mechanic.js
       Handles uploaded audio and microphone input. It uses p5.sound
       analysis values such as amplitude, FFT, and stereo channel data
       to control audio-reactive visual effects.

    4. perlin-noise-mechanic.js
       Handles smoother noise-based motion so the cans move more
       naturally instead of shaking randomly.

    5. soup-can.js
       Contains the drawing functions for the soup cans and uses values
       from the mechanic files to change their appearance.

    6. sketch.js
       Main controller file. It runs setup(), draw(), grid creation,
       and connects all mechanics into the final interactive artwork.
  -->
       
  <script src="time-based-mechanic.js"></script>
  <script src="user-input-mechanic.js"></script>
  <script src="audio-mechanic.js"></script>
  <script src="perlin-noise-mechanic.js"></script>
  <script src="soup-can.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
